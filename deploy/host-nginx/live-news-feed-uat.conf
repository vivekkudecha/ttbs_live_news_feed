# Host (system) nginx vhost for the TTBS UAT stack. NOT part of any image.
#
#   browser ──TLS──> host nginx :443 (this file) ──http──> 127.0.0.1:5175 gateway container
#                                                          (./deploy.sh uat up publishes it there)
#
# Install:   sudo cp deploy/host-nginx/live-news-feed-uat.conf /etc/nginx/conf.d/
#            sudo nginx -t && sudo systemctl reload nginx
#
# This vhost only terminates TLS and forwards. Routing, rate limits, per-route body limits,
# CSP and the other security headers all live in the gateway (deploy/nginx/nginx.conf);
# adding them here too would send every header twice.

# server {
#     listen 80;
#     listen [::]:80;
#     server_name live-news-feed-uat.ai.tatatel.co.in;
#     server_tokens off;

#     # The session cookie is Secure (SESSION_COOKIE_SECURE=true), so sign-in only works over HTTPS.
#     return 301 https://$host$request_uri;
# }

server {
    # listen 443 ssl;
    # listen [::]:443 ssl;
    listen 80;
    listen [::]:80;
    server_name live-news-feed-uat.ai.tatatel.co.in;
    server_tokens off;

    # A certificate whose names include live-news-feed-uat.ai.tatatel.co.in. The existing
    # *.uat.ai.tatatel.co.in wildcard does NOT cover it (a wildcard matches one label only).
    # ssl_certificate     /etc/nginx/ssl/live_news_feed/fullchain.crt;
    # ssl_certificate_key /etc/nginx/ssl/live_news_feed/privkey.key;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    # ssl_prefer_server_ciphers off;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;

    # The one header the gateway leaves to whoever terminates TLS (see deploy/nginx/headers.conf).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The gateway enforces the real limits per route (2 MB default, 1 GB for /api/v1/imports).
    # This only has to be at least the largest of them.
    client_max_body_size 1024m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof their IP
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Stream dataset uploads straight to the gateway instead of spooling 1 GB to disk here.
        proxy_request_buffering off;

        # Backend redirects carry the gateway's plain-http scheme: send browsers to https.
        proxy_redirect http://$host/ https://$host/;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;   # matches the gateway's /api/v1/imports timeouts
        proxy_read_timeout 600s;
    }
}
