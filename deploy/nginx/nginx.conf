# TTBS gateway: the only container with a published port. One nginx does everything:
#
#   /              the built SPA (static files in this image)
#   /api/          -> api:8000            every route behind sign-in
#   /phpmyadmin/   -> phpmyadmin:80       dev/uat only (tools.conf)
#
# Change a file here, then: ./deploy.sh <dev|uat|prod> up   (the config is baked into the image)
# TLS is terminated in front of this gateway (out of scope). Then enable HSTS in headers.conf.

# --- Client IP: this gateway is the edge, so $remote_addr is the client. Behind a load balancer,
# trust ONLY its range so rate limits and audit logs see the real client:
#   set_real_ip_from 10.0.0.0/8;  real_ip_header X-Forwarded-For;  real_ip_recursive on;

# --- Rate limits per client IP. JSON 429 when exceeded (see @too_many).
limit_req_zone $binary_remote_addr zone=api:10m    rate=20r/s;  # UI polls a few endpoints every 2-5 s
limit_req_zone $binary_remote_addr zone=login:10m  rate=6r/m;   # online password guessing (+ app lockout)
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;  # SPA shell and assets
limit_req_zone $binary_remote_addr zone=tools:10m  rate=10r/s;  # phpMyAdmin, /docs (dev/uat)
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# --- Caching policy (docs/caching-policy.md). Empty = no header from us.
#   /assets/*  content-hashed names: cache 1 year | the SPA shell: always revalidate
#   other static files: 1 day | /api/ sends its own "no-store" | tools manage their own
map $uri $cache_control {
    default                         "public, max-age=86400";
    /index.html                     "no-cache";
    ~^/assets/                      "public, max-age=31536000, immutable";
    ~^/(api|phpmyadmin|docs|openapi) "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;   # relative redirects: the published port differs from 8080
    root /usr/share/nginx/html;

    # Request size / slow-client limits (uploads and sign-in override below).
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    send_timeout 60s;
    large_client_header_buffers 4 16k;
    limit_conn perip 60;

    # Only the methods the app uses (TRACE, CONNECT, ... get 405).
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Response headers for every location below. nginx rule: a location that sets its own
    # add_header loses these, so the few that do (429, tools) include headers.conf again.
    include /etc/nginx/headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $cache_control;   # no "always": errors are never cached

    # Proxy settings for every upstream. X-Forwarded-For is OVERWRITTEN, never appended, so a
    # client cannot fake its IP into audit rows or lockout logs.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-Content-Type-Options;   # added once, by headers.conf
    proxy_connect_timeout 10s;

    error_page 429 = @too_many;
    location @too_many {
        include /etc/nginx/headers.conf;
        add_header Retry-After "10" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Wait a moment and try again.","details":null,"request_id":null}}';
    }

    # Never serve dotfiles (.git, .env, ...).
    location ~ /\.(?!well-known/) { return 404; }

    # Prometheus metrics stay private (scrape api:8000/metrics inside the container network).
    location = /metrics { return 404; }

    # ---- API ----
    location = /api/v1/auth/login {          # sign-in: strict rate, tiny bodies
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://api:8000;
    }
    location ^~ /api/v1/imports {             # dataset uploads: up to 1 GB, streamed
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 1024m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://api:8000;
    }
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://api:8000;
    }

    # ---- Dev/uat tools (phpMyAdmin, API docs). The prod image has no tools.conf. ----
    include /etc/nginx/tools*.conf;

    # ---- The SPA (static, read-only) ----
    location / {
        limit_req zone=static burst=100 nodelay;
        limit_except GET HEAD { deny all; }
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
        try_files $uri /index.html;   # client-side routes get the shell
    }
}
