# Dev/uat-only routes, included by nginx.conf. Copied into the image only when built with
# WITH_TOOLS=true (deploy.sh does that for dev and uat); prod images do not contain this file.

# phpMyAdmin, behind two locks: this password gate (GATEWAY_PMA_HTPASSWD, bcrypt), then a MySQL
# login (root refused: deploy/phpmyadmin.php).
location = /phpmyadmin { return 301 /phpmyadmin/; }
location ^~ /phpmyadmin/ {
    limit_req zone=tools burst=20 nodelay;
    client_max_body_size 512m;
    auth_basic "TTBS database tools";
    auth_basic_user_file /tmp/auth/phpmyadmin.htpasswd;
    # phpMyAdmin sends its own CSP (it needs inline scripts), so ours is not added here; its
    # X-Frame-Options is replaced by ours so there is exactly one.
    include /etc/nginx/headers.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-Content-Type-Options;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_pass http://phpmyadmin:80/;
    proxy_redirect default;
    proxy_redirect / /phpmyadmin/;   # phpMyAdmin thinks it lives at "/"
}

# FastAPI docs. Only answer when the API runs with ENV=dev (it disables them for ENV=prod).
# Swagger UI loads its script and styles from jsDelivr and runs one inline script.
location = /docs {
    limit_req zone=tools burst=20 nodelay;
    include /etc/nginx/headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    proxy_pass http://api:8000;
}
location = /openapi.json {
    limit_req zone=tools burst=20 nodelay;
    proxy_pass http://api:8000;
}
