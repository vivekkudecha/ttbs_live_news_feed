# Security headers for every response. Included in each location (an add_header inside a location
# replaces the inherited ones). "always" = also on 4xx/5xx and rate-limit responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# HSTS belongs here once HTTPS terminates in front of (or at) this gateway:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
