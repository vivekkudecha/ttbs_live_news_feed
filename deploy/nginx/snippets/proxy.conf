proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, never append: a client-supplied X-Forwarded-For must not reach the backend, or it
# could fake its IP in audit rows and lockout logs. (Behind a load balancer: see real_ip in
# conf.d/default.conf, which rewrites $remote_addr to the real client first.)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Connection "";
# Upstreams must not advertise software; nosniff is added once, by security-headers.conf.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header X-Content-Type-Options;
proxy_connect_timeout 10s;
