# Gateway: the ONLY container that publishes a host port.
#
#   nginx (gateway) ──> frontend:80      static SPA (its own nginx, no proxying)
#                   ──> api:8000         /api/
#                   ──> phpmyadmin:80    /phpmyadmin/   (dev/uat only, see extra/tools.conf)
#
# deploy/nginx/conf.d/ is mounted at /etc/nginx/conf.d (a directory mount, so edits show up on `nginx -s reload`).

server {
    listen 80;
    server_name _;

    # Relative redirects: the published host port (e.g. 5173) differs from the container's 80.
    absolute_redirect off;

    # Datasets can be up to 1 GB (backend import_max_bytes).
    client_max_body_size 1024M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Backend API. Stream large uploads/downloads straight through instead of spooling to disk.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 75s;
    }

    # Prometheus metrics stay private: scrape api:8000/metrics from inside the container network.
    location = /metrics {
        return 404;
    }

    # Environment-specific routes (phpMyAdmin, API docs). Prod mounts nothing here.
    include /etc/nginx/extra/*.conf;

    # Everything else: the frontend's static nginx (it handles SPA routing and asset caching).
    location / {
        proxy_pass http://frontend:80;
    }
}
