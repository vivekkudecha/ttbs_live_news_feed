# Gateway: the ONLY container that publishes a host port.
#
#   nginx (gateway) ──> frontend:8080    static SPA (its own nginx, sets asset caching)
#                   ──> api:8000         /api/
#                   ──> phpmyadmin:80    /phpmyadmin/   (dev/uat only, see extra/tools.conf)
#
# Built into the gateway image (deploy/nginx/Dockerfile): change a file, then
#   podman-compose -f docker-compose.<env>.yml up -d --build gateway
#
# Hardening: rate limits per client IP, request size/time limits, method allow-list, security
# headers + CSP, no version banners, no upstream banners, X-Forwarded-For overwritten.
# TLS is terminated in front of this gateway (out of scope here); see snippets/security-headers.conf
# for HSTS once it is.

# --- Client IP -----------------------------------------------------------------------------
# This gateway is the edge: $remote_addr is the client. If a load balancer / reverse proxy is put
# in front, trust ONLY its address so rate limits and audit logs see the real client:
#   set_real_ip_from 10.0.0.0/8;   # the LB's address range
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;

# --- Rate limits (per client IP) -----------------------------------------------------------
# api:    normal UI use polls a few endpoints every 2-5 s (~4-8 req/s for a busy run page).
# login:  slow enough to make online password guessing useless (the app also locks accounts).
# static: the SPA shell and assets (assets are cached by browsers for a year).
# tools:  phpMyAdmin (dev/uat).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tools:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    absolute_redirect off;   # relative redirects: the published port differs from 8080

    # Slow-client (slowloris) and oversized-request protection. Uploads get their own limit below.
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    send_timeout 60s;
    large_client_header_buffers 4 16k;
    limit_conn perip 60;

    # Only the methods the app uses. (TRACE/TRACK/CONNECT and anything exotic: 405.)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Rate-limited and errors answer in the API's JSON error format.
    error_page 429 = @too_many;
    location @too_many {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After "10" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Wait a moment and try again.","details":null,"request_id":null}}';
    }

    # Never serve dotfiles (.git, .env, ...) whatever an upstream would do.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Sign-in: strict limit, small bodies.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        proxy_pass http://api:8000;
    }

    # Dataset uploads: up to 1 GB (backend import_max_bytes), streamed straight through.
    location ^~ /api/v1/imports {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 1024m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        proxy_pass http://api:8000;
    }

    # The rest of the API. Responses are never cached (the API sends Cache-Control: no-store).
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        proxy_pass http://api:8000;
    }

    # Prometheus metrics stay private: scrape api:8000/metrics from inside the container network.
    location = /metrics {
        return 404;
    }

    # Environment-specific routes (phpMyAdmin, API docs). Prod images contain none.
    include /etc/nginx/extra/*.conf;

    # Everything else: the frontend's static nginx (SPA routing + caching headers are set there).
    location / {
        limit_req zone=static burst=100 nodelay;
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        proxy_pass http://frontend:8080;
    }
}
