# Dev/UAT-only gateway routes. Included by conf.d/default.conf; NOT mounted in prod.

# MySQL admin panel. Log in with MYSQL_USER / MYSQL_PASSWORD from the stack's .env file.
location = /phpmyadmin {
    return 301 /phpmyadmin/;
}
location ^~ /phpmyadmin/ {
    proxy_pass http://phpmyadmin:80/;
    # phpMyAdmin thinks it lives at "/": put the /phpmyadmin/ prefix back on its redirects.
    proxy_redirect default;
    proxy_redirect / /phpmyadmin/;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
}

# FastAPI interactive docs (Swagger UI fetches /openapi.json).
location = /docs {
    proxy_pass http://api:8000;
}
location = /openapi.json {
    proxy_pass http://api:8000;
}
