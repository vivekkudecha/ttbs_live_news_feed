# Dev/UAT-only gateway routes. Copied into the gateway image only when built with
# WITH_TOOLS=true (docker-compose.dev.yml / .uat.yml); prod images do not contain this file.

# MySQL admin panel. Two locks: the gateway's own password gate (GATEWAY_PMA_HTPASSWD, bcrypt),
# then phpMyAdmin's MySQL login (root is refused, see PMA_USER_CONFIG_BASE64 in the compose files).
location = /phpmyadmin {
    return 301 /phpmyadmin/;
}
location ^~ /phpmyadmin/ {
    limit_req zone=tools burst=20 nodelay;
    client_max_body_size 512m;
    auth_basic "TTBS database tools";
    auth_basic_user_file /tmp/auth/phpmyadmin.htpasswd;
    include /etc/nginx/snippets/proxy.conf;
    # phpMyAdmin sends its own CSP (it needs inline scripts); ours would break it. Replace its
    # frame header with ours so there is exactly one.
    proxy_hide_header X-Frame-Options;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_pass http://phpmyadmin:80/;
    # phpMyAdmin thinks it lives at "/": put the /phpmyadmin/ prefix back on its redirects.
    proxy_redirect default;
    proxy_redirect / /phpmyadmin/;
}

# FastAPI interactive docs (ENV=dev only: the API disables them when ENV=prod, so UAT answers 404).
# Swagger UI loads its script and styles from jsDelivr and runs one inline script.
location = /docs {
    limit_req zone=tools burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    proxy_pass http://api:8000;
}
location = /openapi.json {
    limit_req zone=tools burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://api:8000;
}
