[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP047"]  # B008: FastAPI Depends()/File() in defaults

[tool.ruff.lint.per-file-ignores]
"app/research/prompts.py" = ["E501"]  # prompt text
