server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Allow up to 1 GB file uploads (matches backend import_max_bytes for datasets)
    client_max_body_size 1024M;

    # Reverse proxy for backend API. "^~" stops the static-asset regex below from capturing
    # API paths that happen to end in .js/.png/etc.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large uploads/downloads straight through instead of spooling 1 GB to the container disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 75s;
    }

    # Prometheus metrics: not proxied publicly. Scrape api:8000/metrics from inside the
    # Docker network (dev/uat: 127.0.0.1:8000 / 8001 on the host) instead.
    location = /metrics {
        return 404;
    }

    # The SPA shell must never be cached, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: fallback all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static frontend assets (Vite fingerprints their file names)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
