# Frontend container: serves the built SPA only (no proxying; the gateway nginx in front routes
# /api/ to the backend: deploy/nginx/conf.d/default.conf). Security headers are added by the gateway.
#
# Caching policy (docs/caching-policy.md):
#   /assets/*      content-hashed file names  -> public, 1 year, immutable (a new build = new names)
#   index.html     the SPA shell              -> no-cache (always revalidated: deploys show at once)
#   other files    favicon etc.               -> public, 1 day
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~ /\. {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routing: unknown paths get the shell (which is never cached, see above).
    location / {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri /index.html;
    }
}
