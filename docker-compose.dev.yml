# DEV - full stack including MySQL and Redis (layout and controls: docs/security.md).
#   cp .env.dev.example .env.dev                  then fill every CHANGE_ME and empty secret
#   cp .env.gateway.example .env.dev.gateway      phpMyAdmin gate credentials (bcrypt line)
#   podman-compose -f docker-compose.dev.yml up -d --build
#
# Only the gateway publishes a port, on localhost: http://127.0.0.1:5173
#   /             -> frontend    static SPA
#   /api/         -> api         every route behind sign-in (app/core/permissions.py)
#   /phpmyadmin/  -> phpmyadmin  gateway password, then a MySQL login (root refused)
#   /docs         -> Swagger UI  ENV=dev only (the API turns it off when ENV=prod)
# Networks: edge   = gateway, frontend, api, phpmyadmin
#           data   = internal, no route out: MySQL, Redis and the services that use them
#           egress = internet access for api + worker (LLM providers)
name: ttbs-dev

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  build: ./backend
  image: ttbs-backend:dev
  env_file: .env.dev
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  pids_limit: 512
  logging: *logging

x-after-db: &after-db
  mysql: { condition: service_healthy }
  redis: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

services:
  mysql:
    image: docker.io/library/mysql:8.4.13
    restart: unless-stopped
    env_file: .env.dev
    security_opt: ["no-new-privileges:true"]
    command: >-
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00 --local-infile=0 --skip-name-resolve
    volumes: [mysql_data:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  redis:
    image: docker.io/library/redis:7.4.12-alpine
    restart: unless-stopped
    env_file: .env.dev
    security_opt: ["no-new-privileges:true"]
    # Password required; admin commands nothing in the app uses are disabled.
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --protected-mode yes --requirepass "$$REDIS_PASSWORD"
        --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command CONFIG ""
        --rename-command DEBUG "" --rename-command SHUTDOWN ""
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      retries: 10
    logging: *logging

  phpmyadmin:   # MySQL admin panel, only through the gateway at /phpmyadmin/
    image: docker.io/library/phpmyadmin:5.2.3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 512M
      HIDE_PHP_VERSION: "true"
      # AllowRoot=false, no server/PHP info, no version check, 30-minute login cookie.
      PMA_USER_CONFIG_BASE64: ""
    networks: [edge, data]
    depends_on: { mysql: { condition: service_healthy } }
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [data]
    depends_on:
      mysql: { condition: service_healthy }

  api:
    <<: *backend
    volumes: [uploads:/app/storage/uploads]
    networks: [edge, data, egress]
    depends_on: *after-db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-P", "threads", "-c", "16", "-Q", "research,notify,maintenance", "-l", "INFO"]
    volumes: [uploads:/app/storage/uploads]
    networks: [data, egress]
    depends_on: *after-db

  beat:   # exactly one per environment
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    networks: [data]
    depends_on: *after-db

  frontend:
    build: { context: ./frontend, args: { VITE_API_URL: "/" } }
    image: ttbs-frontend:dev
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      retries: 5
    logging: *logging

  gateway:   # the ONLY published port: nginx -> frontend | api | phpmyadmin
    build: { context: ./deploy/nginx, args: { WITH_TOOLS: "true" } }
    image: ttbs-gateway:dev
    restart: unless-stopped
    env_file: .env.dev.gateway   # GATEWAY_PMA_HTPASSWD only: the edge gets no app secrets
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    ports: ["127.0.0.1:5173:8080"]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
      phpmyadmin: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      retries: 5
    logging: *logging

networks:
  edge: {}
  data: { internal: true }
  egress: {}

volumes:
  mysql_data:
  redis_data:
  uploads:
